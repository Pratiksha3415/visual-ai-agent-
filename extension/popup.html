<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Visual AI Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Visual AI Agent</h1>
    <span id="statusPill" class="pill off">OFF</span>
  </header>

  <section class="toggle-row">
    <label class="switch">
      <input type="checkbox" id="monitorToggle" />
      <span class="slider"></span>
    </label>
    <span>Monitoring is <strong id="statusText">off</strong></span>
  </section>

  <section class="toggle-row">
    <label class="switch small">
      <input type="checkbox" id="screenshotToggle" />
      <span class="slider"></span>
    </label>
    <span>Periodic screenshots</span>
  </section>

  <p class="hint">
    When on, this extension logs the pages you visit and tab activity to the
    backend configured in <a href="#" id="openOptions">Settings</a>. Nothing
    is collected while monitoring is off.
  </p>

  <section class="log-section">
    <div class="log-header">
      <h2>Recent activity (this device)</h2>
      <button id="clearBtn">Clear</button>
    </div>
    <ul id="eventList"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
