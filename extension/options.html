<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Visual AI Agent - Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 40px auto; color: #1f2430; }
    label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 20px; padding: 8px 16px; border: none; background: #1a9c4b; color: white; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 10px; font-size: 12px; color: #1a9c4b; }
    h1 { font-size: 18px; }
    .note { font-size: 12px; color: #666; margin-top: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Visual AI Agent — Settings</h1>

  <label for="backendUrl">Backend events endpoint</label>
  <input id="backendUrl" type="text" placeholder="http://localhost:8787/events" />

  <label for="apiKey">API key (optional, sent as Bearer token)</label>
  <input id="apiKey" type="text" placeholder="optional" />

  <label for="batchSize">Batch size (events per upload)</label>
  <input id="batchSize" type="number" min="1" max="200" />

  <label for="batchIntervalSec">Upload interval (seconds)</label>
  <input id="batchIntervalSec" type="number" min="1" max="600" />

  <label for="screenshotIntervalSec">Screenshot interval (seconds, if enabled)</label>
  <input id="screenshotIntervalSec" type="number" min="5" max="3600" />

  <button id="saveBtn">Save settings</button>
  <div class="status" id="statusMsg"></div>

  <p class="note">
    This agent only uploads data while monitoring is switched on from the
    toolbar popup. All configuration here is stored locally in your browser
    profile (chrome.storage.local) and is never sent anywhere except the
    backend URL you specify.
  </p>

  <script src="options.js"></script>
</body>
</html>
